# Checks, in the Verification section of the PR body, that each PR got a Codex review before merge.
# The body is untrusted, so it is passed through an environment variable and only read (never expanded into shell expressions).
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  codex-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: The Verification section has the Codex review result
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # The template's comments also mention Codex, so drop HTML comments before taking the section.
          # PRs opened before the English template use the Japanese heading.
          # english-exempt: the Japanese Verification heading of PRs opened before the English template
          printf '%s\n' "$BODY" | tr -d '\r' | perl -0pe 's/<!--.*?-->//gs' | awk '/^## (Verification|検証)[ \t]*$/{f=1;next} /^## /{f=0} f' > verification.txt
          grep -q "Codex" verification.txt || {
            echo "The Verification section of the PR body has no Codex review result (see review in CLAUDE.md and the codex-review Skill)"
            exit 1
          }
