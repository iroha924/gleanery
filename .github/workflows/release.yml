# Builds the npm release candidate in CI and stages it. Publishing happens only when the owner approves with 2FA on npm.
#
# Runs when a `v<version>` tag is pushed to the PR head with the owner's account (before the merge). prepare checks the tag, PR, and CI and builds the tarball,
# and after the `npm-release` environment is approved, stage passes the same tarball to `npm stage publish --tag next`.
# Claude runs the local steps for approval, merge, and promotion to latest, and the owner approves and authenticates (.agents/skills/plugin-release/SKILL.md).
#
# No secrets. It reaches npm through trusted publishing (OIDC), with provenance.
name: release

on:
  push:
    tags: ["v*"]
  # For PRs that change the release steps and for release PRs, run everything up to stage
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-gate.mjs
      - scripts/check-tarball.mjs
      - scripts/lib/release-gate.mjs
      - scripts/lib/tarball.mjs
      - scripts/check-sbom.mjs
      - scripts/lib/sbom.mjs
      # A PR that bumps the version is a release PR, so run the same steps before the tag is pushed
      - plugin/package.json

permissions:
  contents: read

jobs:
  # The SBOM is built separately from the job that builds what ships (prepare). syft is fetched with a pinned checksum from its distributor (a single file with no dependencies)
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build a CycloneDX SBOM from bun.lock
        env:
          SYFT: "1.52.0"
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT}/syft_${SYFT}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar xzf syft.tar.gz syft
          ./syft scan "dir:$GITHUB_WORKSPACE/server" -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json" -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 7
          if-no-files-found: error

  prepare:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha512: ${{ steps.pack.outputs.sha512 }}
      tgz: ${{ steps.pack.outputs.tgz }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # This job builds what ships, so it does not read caches written by other runs (cache poisoning)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      # The tag name matches every version, the commit is the head of an open PR into main, and that PR's check and pr-body succeeded
      - name: May this tag be staged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

      # Without the environment, GitHub creates one with no protection, and stage runs without waiting for approval
      - name: Does npm-release have an approver
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/npm-release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]] | length')"
          test "$reviewers" -gt 0

      - name: Install dependencies
        run: bun run setup

      - name: Lint, types, bundle, tests, SQL reach, and the child process lane
        run: bun run verify

      # If verify rewrote tracked files, what ships would drift from the tag commit
      - name: Is the working tree still at the tag commit
        run: git diff --exit-code HEAD

      # **Ship the checked tarball as is.** The stage job does not rebuild it.
      - name: Build and check the tarball
        id: pack
        run: |
          set -e
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          tgz="$(cd plugin && npm pack --silent --pack-destination "$out")"
          node scripts/check-tarball.mjs "$out/$tgz"
          sha512="$(sha512sum "$out/$tgz" | cut -d' ' -f1)"
          integrity="sha512-$(openssl dgst -sha512 -binary "$out/$tgz" | base64 -w0)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"
          {
            echo "### Checked tarball"
            echo
            echo "- file: \`$tgz\`"
            echo "- SHA-512: \`$sha512\`"
            echo "- integrity: \`$integrity\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Does the SBOM list every bundled dependency (the THIRD_PARTY_NOTICES.md table)?
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Compare the SBOM with the third-party notices
        run: |
          set -eo pipefail
          node scripts/check-sbom.mjs "$RUNNER_TEMP/sbom/sbom.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.tgz }}
          retention-days: 7
          if-no-files-found: error

  stage:
    needs: [sbom, prepare]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Does not start until the owner approves. The trusted publisher is limited to this workflow and this environment
    environment: npm-release
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # The allowed endpoints are the stage destinations audit observed in the v0.37.7 release, plus nodejs.org for when setup-node cannot fetch from GitHub
      # (harden-runner allows GitHub infrastructure such as OIDC and artifacts by default)
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            nodejs.org:443
      # Stop before publishing if the block is not working
      - name: Is traffic outside the allowed endpoints blocked
        run: |
          if curl -sS --max-time 10 -o /dev/null https://example.com; then
            echo "reached an endpoint outside the allowlist" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # npm stage exists from npm 11.15.0. Node 24.21.0 bundles npm 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Does this npm version have stage
        run: |
          set -e
          version="$(npm --version)"
          IFS=. read -r major minor _ <<< "$version"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 15 ]; }; then
            echo "npm $version has no stage command" >&2
            exit 1
          fi

      # Check again that the PR head and main did not move while waiting for approval
      - name: May this tag be staged (after approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release

      - name: Is it the same tarball that was checked
        env:
          TGZ: ${{ needs.prepare.outputs.tgz }}
          SHA512: ${{ needs.prepare.outputs.sha512 }}
        run: |
          set -e
          actual="$(sha512sum "$RUNNER_TEMP/release/$TGZ" | cut -d' ' -f1)"
          test "$actual" = "$SHA512"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      # Attach the SBOM attestation to the same compared tarball (separate from npm provenance; check it with gh attestation verify)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tgz }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.cdx.json

      # The same version cannot be staged twice. Do not rerun the run after this step succeeds (if it fails, bump the version and release again)
      - name: Stage to npm
        env:
          TGZ: ${{ needs.prepare.outputs.tgz }}
        run: |
          set -eo pipefail
          npm stage publish "$RUNNER_TEMP/release/$TGZ" --tag next --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          {
            echo "### stage"
            echo
            echo '```'
            grep -E "staged with id|integrity|shasum" "$RUNNER_TEMP/stage.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
