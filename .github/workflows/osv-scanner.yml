# Checks dependencies for known vulnerabilities with OSV and uploads to code scanning. GitHub's dependency graph does not read server/bun.lock,
# so transitive dependencies are visible only here. Known vulnerabilities do not fail it (fail-on-vuln: false); only a failure of the scan itself does.
# The new-in-PR comparison (osv-scanner-reusable-pr.yml) is not used (google/osv-scanner-action#136). On PRs it runs only when this workflow changes.
name: osv-scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths: [".github/workflows/osv-scanner.yml"]

permissions: {}

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: false
