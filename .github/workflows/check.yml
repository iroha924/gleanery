# Checks what pre-commit does not.
#
# **The main value is the tests and SQL reach in `bun run verify`**: pre-commit does not run them; pre-push and CI do.
# The rest duplicates pre-commit, but closes the `--no-verify` and no-hooks paths here. The plugin version, though,
# is checked not per commit but across the whole range from the merge target or the pre-push commit to HEAD.
#
# **No secrets.** The database is SQLite in a temp directory, and the tests pass without credentials.
name: check

on:
  push:
    branches: [main]
  pull_request:

# It neither reasons nor writes anywhere, so it gets read access only.
permissions:
  contents: read

concurrency:
  # Runs for pushes to main are not cancelled. Cancelling one means the version check never sees that push's range.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Checks that it passes on both the engines floor (24.15) and the next line (26). If one fails, the other's result is kept.
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15", "26"]
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag's contents can be swapped later).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches the bases the version check compares against (the merge target and the pre-push commit).
          fetch-depth: 0
          persist-credentials: false

      # **Pin the bun version.** Letting it float picks versions that cannot read the lockfile
      # (actually hit on Vercel: 1.3.14 could not read lockfileVersion 2 and failed).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Tests run on node's test runner, and the database uses Node's built-in node:sqlite.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Placed before installing dependencies and verify. If a push to main fails earlier, its range is never checked.
      - name: Is the plugin version bumped
        env:
          # For a PR, the first parent of the checked-out merge commit is the merge target; for a push to main, the pre-push commit.
          # Whether a change reaches users depends on whether the version differs from the previous main, so the whole range is compared.
          # On a work branch, pre-commit compares against the fork point from main (scripts/check-mcp-version.mjs).
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node scripts/check-mcp-version.mjs --base "$BASE"

      # Hooks can be skipped, so check what was actually committed: the PR's own commits, or the commits pushed to main.
      - name: commit message
        env:
          RANGE: ${{ github.event_name == 'pull_request' && 'HEAD^1..HEAD^2' || format('{0}..HEAD', github.event.before) }}
        run: node scripts/check-commit-msg.mjs --range "$RANGE"

      - name: Install dependencies
        run: bun run setup

      # Uses the same source of truth as the local pre-push: Biome, types, the package bundle, tests (with sql:reach counting whether every SQL
      # ran against a real SQLite database), and sql:live, which runs the CLI and capture as child processes against a database in a temp HOME.
      - name: Lint, types, bundle, tests, SQL reach, and the child process lane
        run: bun run verify

      # **Check what ships as a tarball.** dist and db are untracked, so `git diff` shows nothing.
      # The same script as release checks the file list, starting outside the repository, and creating a database.
      - name: Is the shipped tarball self-contained
        run: |
          set -e
          cd plugin
          tgz="$(npm pack --silent)"
          node ../scripts/check-tarball.mjs "$tgz"

  # **What ships must run on Windows too** (AGENTS.md). Development of this repository assumes macOS / Linux, so verify does not run here;
  # it checks only that the bundled tarball starts without node_modules and can create a database with node:sqlite. How the CLI draws in a terminal
  # shows only on a real machine (CI cannot check it).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15"
      - name: Install dependencies and bundle
        run: |
          set -e
          bun run setup
          bun run bundle
      - name: Does the shipped tarball start on Windows
        run: |
          set -e
          cd plugin
          tgz="$(npm pack --silent)"
          out="$(mktemp -d)"
          tar xzf "$tgz" -C "$out"
          node "$out/package/dist/cli.js" --help > /dev/null
          # On Windows, os.homedir() reads USERPROFILE.
          home="$(mktemp -d)"
          HOME="$home" USERPROFILE="$home" node "$out/package/dist/cli.js" init
          test -f "$home/.sphica/sphica.db"
          # doctor can return 1 depending on plugin install state (this runner has no plugin). Check only the DB rows.
          HOME="$home" USERPROFILE="$home" node "$out/package/dist/cli.js" doctor > doctor.out || true
          grep -E "✓ Schema version" doctor.out
          grep -E "✓ Full-text index" doctor.out
          # Does MCP start and return the tool list?
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | HOME="$home" USERPROFILE="$home" timeout 30 node "$out/package/dist/mcp.js" > mcp.out || true
          # Under pipefail, grep -q closing early makes the previous stage die of SIGPIPE, so write the output first and then check it.
          grep -q '"recall"' mcp.out
