# pre-commit が見ていないものを見る。
#
# **いちばんの価値は `bun run test`** — pre-commit は走らせず、pre-pushとCIで実行する。
# 残りは重複だが、`--no-verify` とフック未導入の経路をここで塞ぐ。ただし plugin の版は
# commit ごとではなく、merge 先か push 前の commit から HEAD までをまとめて見る。
#
# **シークレットを置かない。**テストは資格情報なしで通る（DB が要る 2 件は自分で skip する）。
# 資格情報なしでもテスト自体は通り、外部サービスを使う検査だけが自分で skip する。
name: check

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Vercel 本番では Services が /api を Hono へ送る。CI もローカル rewrite を入れずにビルドする。
  VERCEL: "1"

on:
  push:
    branches: [main]
  pull_request:

# 推論も外部への書き込みもしないので、読み取りだけ渡す。
permissions:
  contents: read

concurrency:
  # main への push の run は取り消さない。取り消すと、版の検査がその push の範囲を二度と見ない。
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # third-party action は full commit SHA で pin する（タグは後から中身を差し替えられる）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 版の検査が比べる基準（merge 先と push 前の commit）を手元に置く。
          fetch-depth: 0

      # **bun の版を固定する。**浮かせると lockfile を読めない版が選ばれる
      # （Vercel で実際に踏んだ: 1.3.14 が lockfileVersion 2 を読めず落ちた）。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # テストは node の test runner で走る。server/package.json の engines は >=22.18。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # 依存の導入と verify より前に置く。手前で落ちた main への push は、その範囲を二度と見ない。
      - name: plugin の版が上がっているか
        env:
          # PR では checkout した merge commit の 1 つ目の親が merge 先、main への push では push 前の commit。
          # 利用者に届くかは前の main と版が違うかで決まるので、この範囲をまとめて比べる。
          # 版上げを配布物と同じ commit に入れる決まりは pre-commit が commit ごとに見る。
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node scripts/check-mcp-version.mjs --base "$BASE"

      # **`code.ts` は rg を叩く。**ランナーには入っていない（実測: 無い状態で
      # `code.test.ts` が 18 件中 8 件落ちる）。**探索そのものを確かめるテストなので、
      # 偽物では代われない。**rg を起動できないことは結果に出るが、
      # 出たところでその 8 件は確かめられない。
      - name: ripgrep を入れる
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: 依存を入れる
        run: bun run setup

      # ローカルの pre-push と同じ正本を使う。Biome、両アプリの型、サーバーのテスト、
      # Next.js の本番ビルド（App Router のバンドルと prerender）をまとめて検査する。
      - name: Next.js と Hono を検証
        run: bun run verify

      # **バンドルし直して差分が出たら、dist が古い。**配布物はソースと一緒にコミットされるので、
      # 忘れると Codex 側が古いコードで動き続ける（.agents/skills/plugin-release/SKILL.md）。
      - name: 配布物が最新か
        run: |
          set -e
          bun run bundle
          git diff --exit-code -- plugin/dist

      # 同じ知識が複数の出口に写されている場所の突き合わせ。README の CLI 一覧がずれていると、
      # check-pairs.mjs は書き直して staged へ戻し、0 で終わる。index ではなく HEAD と比べて落とす。
      - name: 対の突き合わせ
        run: |
          set -e
          node scripts/check-pairs.mjs
          git diff --exit-code HEAD -- README.md
