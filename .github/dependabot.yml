version: 2
updates:
  # No bun dependencies. Dependabot reads bun.lock only up to lockfileVersion 1, and server/bun.lock is 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Nobody has looked at a version right after it is published. Wait out the window hijacked releases target before proposing it
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
