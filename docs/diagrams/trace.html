<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trace（判断を残す）</title>
<style>
:root{
  color-scheme: light dark;
  --paper: light-dark(#f6f1e6, #1b1814);
  --ink: light-dark(#241f18, #f2ecdd);
  --ink-soft: light-dark(#5f5849, #b8ae9a);
  --ink-faint: light-dark(#8c8474, #7d7462);
  --line: light-dark(#3b342a, #cdc4b2);
  --node-fill: light-dark(#ffffff, #262019);
  --group-fill: light-dark(rgba(160,150,130,.10), rgba(200,190,165,.06));
  --pad-fill: light-dark(rgba(120,108,88,.20), rgba(220,210,190,.16));
  --grid: light-dark(rgba(120,108,88,.10), rgba(220,210,190,.055));
  --frontend: light-dark(#2f6f7d, #7fc7d6);
  --backend: light-dark(#3f6b45, #8fc79a);
  --database: light-dark(#5b4a8a, #b6a5e6);
  --cloud: light-dark(#8a6320, #e0b463);
  --security: light-dark(#8c3a45, #e08e99);
  --queue: light-dark(#8a5326, #e0a271);
  --external: light-dark(#6b6355, #a89e8b);
  --f-step: light-dark(#ccd5d9, #38434a);
  --f-decision: light-dark(#e5d3a6, #574828);
  --f-reference: light-dark(#ded7c9, #423d33);
  --f-script: light-dark(#d4c8d1, #453d47);
  --f-agent: light-dark(#c2d0b6, #3a4a36);
  --f-gate: light-dark(#e0c1b2, #513630);
  --f-terminal: light-dark(#3a352c, #e8e1d2);
  --on-terminal: light-dark(#f4efe6, #1f1d18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:.85rem 1.2rem .5rem;flex:none;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.meta{margin-left:auto;color:var(--ink-faint);font-size:.76rem;text-align:right}
h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.01em}
.sub{color:var(--ink-soft);font-size:.86rem;margin-top:.15rem}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
#stage.dragging{cursor:grabbing}
#atlas-svg{width:100%;height:100%;display:block}

/* 図形はすべて Node 側で確定済み。ここは色とテーマだけを与える */
.is-fill{stroke:none}
.is-hatch{fill:none;stroke:var(--ink-faint);stroke-width:.8;opacity:.5}
.is-stroke{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.node.is-fill{fill:var(--node-fill)}
.node.is-stroke{stroke:var(--line);stroke-width:1.5}
.node-frontend.is-stroke{stroke:var(--frontend)} .node-backend.is-stroke{stroke:var(--backend)}
.node-database.is-stroke{stroke:var(--database)} .node-cloud.is-stroke{stroke:var(--cloud)}
.node-security.is-stroke{stroke:var(--security)} .node-queue.is-stroke{stroke:var(--queue)}
.node-external.is-stroke{stroke:var(--external)}
/* skill 型 */
.node-start.is-fill,.node-end.is-fill{fill:var(--f-terminal)}
.node-step.is-fill{fill:var(--f-step)}
.node-decision.is-fill{fill:var(--f-decision)}
.node-reference.is-fill{fill:var(--f-reference)}
.node-script.is-fill{fill:var(--f-script)}
.node-agent.is-fill{fill:var(--f-agent)}
.node-gate.is-fill{fill:var(--f-gate)}
.node-wait.is-fill{fill:var(--f-reference)}
.node-error.is-fill{fill:var(--f-gate)}
.node-error.is-stroke{stroke:var(--security)}
.node-source.is-stroke{stroke:var(--external)} .node-source.is-fill{fill:var(--node-fill)}
.node-transform.is-stroke{stroke:var(--backend)} .node-transform.is-fill{fill:var(--node-fill)}
.node-store.is-stroke{stroke:var(--database)} .node-store.is-fill{fill:var(--node-fill)}
.node-consumer.is-stroke{stroke:var(--frontend)} .node-consumer.is-fill{fill:var(--node-fill)}
.node-governance.is-stroke{stroke:var(--security)} .node-governance.is-fill{fill:var(--node-fill)}
.node-initial.is-fill,.node-terminal.is-fill{fill:var(--f-terminal)}
.node-active.is-fill{fill:var(--f-step)}
.node-waiting.is-fill{fill:var(--f-reference)}
.node-failure.is-fill{fill:var(--f-gate)} .node-failure.is-stroke{stroke:var(--security)}
.lane.is-fill{fill:var(--group-fill)} .lane.is-stroke{stroke:var(--ink-faint);stroke-width:1}
.lane-label{fill:var(--ink-faint)}
.lifeline.is-stroke{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:5 6;opacity:.7}
.msg-label{fill:var(--ink-soft)}
.node-reference.is-stroke{stroke-dasharray:7 5}
.node-script.is-hatch{stroke:var(--ink-faint);opacity:.3}
[data-owner].on-terminal{fill:var(--on-terminal)}
.band-no{fill:var(--ink-faint);opacity:.6}
.node-note{fill:var(--ink-soft)}
.stage.is-fill{fill:var(--group-fill)} .stage.is-stroke{stroke:var(--ink-faint);stroke-width:1}
.stage-label{fill:var(--ink-faint);letter-spacing:.06em}
.edge-back.is-stroke{stroke-dasharray:6 5;--dash-period:11px}
[data-owner]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.group.is-fill{fill:var(--group-fill)} .group.is-stroke{stroke:var(--ink-faint);stroke-width:1.1}
.group-security.is-stroke{stroke:var(--security)}
.group-label{fill:var(--ink-faint);letter-spacing:.06em}
.icon-pad.is-fill{fill:var(--pad-fill)} .icon-pad.is-stroke{stroke:none}
.edge.is-stroke{stroke:var(--ink-soft);stroke-width:1.5}
.edge-emphasis.is-stroke{stroke:var(--ink);stroke-width:2}
.edge-dashed.is-stroke{stroke-dasharray:7 6;--dash-period:13px}
.arrow.is-fill{fill:var(--ink-soft)} .arrow.is-stroke{stroke:var(--ink-soft);stroke-width:1}
.edge-label{fill:var(--ink-soft)}
.edge-label-bg{fill:var(--paper);stroke:none}
.node-label{fill:var(--ink)} .node-sublabel{fill:var(--ink-soft)}
.legend-rule.is-stroke{stroke:var(--ink-faint);stroke-width:1;opacity:.45}
.legend-label{fill:var(--ink-soft)}
text{dominant-baseline:middle;pointer-events:none}

/* 注目状態。architecture では動かさず、関わる線と箱だけを残して他を沈める */
#atlas-svg.has-focus [data-owner]{opacity:.16;transition:opacity .18s}
#atlas-svg.has-focus [data-owner].lit{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
/* 凡例は図の一部ではなく読み方の説明なので、注目しているあいだも沈めない */
#atlas-svg.has-focus [data-owner^="legend"]{opacity:1}

#panel{position:absolute;right:.9rem;bottom:.9rem;display:flex;gap:.4rem;flex-wrap:wrap;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);
  border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:.6rem;padding:.35rem}
#panel button{font:inherit;font-size:.8rem;color:var(--ink);background:none;cursor:pointer;
  border:1px solid transparent;border-radius:.4rem;padding:.3rem .6rem}
#panel button:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
#views{position:absolute;left:.9rem;bottom:.9rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
#views button{font:inherit;font-size:.8rem;color:var(--ink-soft);background:color-mix(in srgb,var(--paper) 85%,transparent);
  border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:999px;padding:.3rem .75rem;cursor:pointer}
#views button[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 42%,transparent)}
#note{position:absolute;left:.9rem;bottom:3rem;max-width:26rem;font-size:.82rem;color:var(--ink-soft)}
#note:empty{display:none}
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);
  border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:.6rem;padding:.6rem .75rem;
  color:var(--ink-soft)}
  border:1.5px solid var(--line);border-radius:3px;background:var(--node-fill)}
/* 描かれていく演出。**静的な状態が最終形**で、そこから逆向きに動かす。
   アニメーションが走らない環境（フレームを作れない headless など）でも図は完成形で出る。 */
@keyframes atlas-draw{from{stroke-dashoffset:var(--len)}}
/* 注目した関係の線を流すのは、時間と順序が主軸の型だけ。
   architecture は空間と依存が主軸で時間軸を持たないので動かさない。 */
/* 動かす距離は刻みの整数倍でないと、1 周ごとに模様が飛ぶ。
   線ごとに刻みが違うので、dasharray を書く場所で周期も宣言する */
@keyframes atlas-flow{to{stroke-dashoffset:calc(-2 * var(--dash-period,14px))}}
/* 破線は線の種類（戻り・非同期）が意味を運ぶので、流すときも自前の刻みを保つ。
   一律に 9 5 を被せると、戻りの線と行きの線が動いている間だけ同じ見た目になる。 */
/* lit は線そのものに付く。子孫セレクタで書くと path の中の path を探すことになり、
   一致するものが無いまま静かに何も起きない */
#atlas-svg.flow path.edge.is-stroke.lit{animation:atlas-flow .7s linear infinite}
#atlas-svg.flow path.edge.is-stroke.lit:not(.is-dashed){stroke-dasharray:9 5;--dash-period:14px}
@keyframes atlas-fade{from{opacity:0}}
.revealing path.is-stroke:not(.is-dashed){stroke-dasharray:var(--len);stroke-dashoffset:0;
  animation:atlas-draw var(--dur) ease-out var(--delay) both}
/* 破線の線は dash で描き進められない（dasharray を奪うと破線が消える）のでフェードで出す */
.revealing path.is-dashed,.revealing path.is-fill,.revealing path.is-hatch,
.revealing text,.revealing .icon{animation:atlas-fade .4s ease-out var(--fade) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 紙に落とす人。操作のための UI は紙では意味を持たないので落とし、
   図は全体が 1 枚に収まる状態にする。図は横長なので既定を横向きにする。 */
@page{size:landscape;margin:12mm}
@media print{
  /* 描画演出は紙では意味が無い。しかも animation-fill-mode:both は遅延中に
     from（opacity 0）を保持するので、アニメーションが進まない経路では図ごと消える */
  .revealing path,.revealing text,.revealing .icon{animation:none!important;opacity:1!important;
    stroke-dasharray:none!important;stroke-dashoffset:0!important}
  #panel,#views{display:none!important}
  body{height:auto;overflow:visible;background:#fff}
  #stage{overflow:visible;background:none;height:auto}
  #atlas-svg{height:auto}
  header{padding-left:0}
}
</style>
</head>

"label":"直すとき","focus":["json","check","ok"],"note":"check が弾いた規則を直してから入れる。DB には触らない。"}],"source":"plugin/skills/trace/SKILL.md","legend":[{"kind":"start","label":"開始","dashed":false,"hachure":false},{"kind":"script","label":"スクリプト","dashed":false,"hachure":true},{"kind":"step","label":"手順","dashed":false,"hachure":false},{"kind":"decision","label":"判断","dashed":false,"hachure":false},{"kind":"reference","label":"参照ファイル","dashed":true,"hachure":false},{"kind":"end","label":"完了","dashed":false,"hachure":false}],"viewBox":[1718,782],"title":"trace（判断を残す）","subtitle":"会話は自動で残るので、次の判断を誤らないための要素だけを選んで DB へ入れる。頼まれたときだけ動く"}</script>
<script>
const SEM = JSON.parse(document.getElementById('atlas-semantics').textContent);
const svg = document.getElementById('atlas-svg');
const stage = document.getElementById('stage');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- 所有者ごとの索引。幾何は触らない ---- */
const byOwner = new Map();
for (const el of svg.querySelectorAll('[data-owner]')) {
  const k = el.dataset.owner;
  if (!byOwner.has(k)) byOwner.set(k, []);
  byOwner.get(k).push(el);
}
const edgesOf = new Map();
for (const e of SEM.edges) {
  for (const n of [e.from, e.to]) {
    if (!edgesOf.has(n)) edgesOf.set(n, []);
    edgesOf.get(n).push(e);
  }
}

/* ---- pan / zoom。viewBox は変えず transform だけ ---- */
const root = document.createElementNS('http://www.w3.org/2000/svg', 'g');
while (svg.firstChild) root.appendChild(svg.firstChild);
svg.appendChild(root);
let view = { x: 0, y: 0, k: 1 };
const apply = () => root.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
// viewBox を要素のピクセル寸法に合わせる。モデル座標のままにすると、ブラウザ自身の
// viewBox フィットと transform が二重に掛かる（実測: 1.195 x 1.123 になり図がはみ出した）。
function syncViewBox() {
  const r = stage.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${Math.max(1, r.width)} ${Math.max(1, r.height)}`);
  return r;
}
function fit() {
  const r = syncViewBox();
  const [mw, mh] = SEM.viewBox;
  const k = Math.min(r.width / mw, r.height / mh) * 0.94;
  view = { k, x: (r.width - mw * k) / 2, y: (r.height - mh * k) / 2 };
  apply();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(6, Math.max(0.15, view.k * f));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; apply();
}
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply();
});
for (const ev of ['pointerup', 'pointercancel']) {
  stage.addEventListener(ev, () => { drag = null; stage.classList.remove('dragging'); });
}


/* ---- 注目。architecture は動かさない。関わるものを残して他を沈める ---- */
function light(ids) {
  for (const el of svg.querySelectorAll('.lit')) el.classList.remove('lit');
  if (!ids || !ids.size) { svg.classList.remove('has-focus'); return; }
  svg.classList.add('has-focus');
  for (const id of ids) for (const el of byOwner.get(id) || []) el.classList.add('lit');
}
const liveEl = document.getElementById('live');
const announce = (text) => { liveEl.textContent = text; };
const labelOf = (id) => SEM.nodes.find((n) => n.id === id)?.label || id;

// 何が残ったかは見た目にしか出ていない。焦点を当てた相手を言葉にする
function describe(nodeId) {
  const out = []; const into = [];
  for (const e of edgesOf.get(nodeId) || []) {
    const other = e.from === nodeId ? e.to : e.from;
    const name = e.label ? `${labelOf(other)}（${e.label}）` : labelOf(other);
    (e.from === nodeId ? out : into).push(name);
  }
  const parts = [labelOf(nodeId)];
  if (out.length) parts.push(`ここから ${out.length} 件: ${out.join('、')}`);
  if (into.length) parts.push(`ここへ ${into.length} 件: ${into.join('、')}`);
  if (!out.length && !into.length) parts.push('つながる相手なし');
  return `${parts.join('。')}。`;
}

function neighbourhood(nodeId) {
  const ids = new Set([nodeId]);
  for (const e of edgesOf.get(nodeId) || []) {
    ids.add(e.id); ids.add(`${e.id}-arrow`); ids.add(e.from); ids.add(e.to);
  }
  // 相手の所属も残す。相手のノードだけ点けて所属名を沈めると、
  // 「次に誰へ渡るか」の答えが半分になる（実測: workflow で送り先のレーン名だけが沈んだ）
  for (const g of SEM.groups) if (g.wraps.some((id) => ids.has(id))) ids.add(g.id);
  return ids;
}
// ホバーで周りを沈めるかは型で決まる。順序や段が全体で意味を持つ図
// （sequence / dataflow）は俯瞰して読むものなので、触っただけで周りが消えるのは害になる。
// 読み筋の切り替えは**明示的な操作**なので、どの型でも従来どおり沈める。
let pinned = null;
let activeView = null;
if (SEM.focus !== 'none') {
  // ポインタを使えないと注目に届かない。所有者ごとに要素を包み直すと重なりの順が変わるので、
  // **ノードごとに最初の 1 つだけ**を焦点の対象にする。描画順はそのまま。
  svg.setAttribute('role', 'group');
  for (const n of SEM.nodes) {
    const own = byOwner.get(n.id) || [];
    own.forEach((el, i) => {
      el.style.pointerEvents = 'all';
      el.addEventListener('pointerenter', () => { if (!pinned && !activeView) light(neighbourhood(n.id)); });
      el.addEventListener('pointerleave', () => { if (!pinned && !activeView) light(null); });
      if (i) return;
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', n.label);
      el.addEventListener('focus', () => {
        if (pinned || activeView) return;
        light(neighbourhood(n.id));
        announce(describe(n.id));
      });
      el.addEventListener('blur', () => { if (!pinned && !activeView) light(null); });
      el.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        if (activeView) return;
        pinned = pinned === n.id ? null : n.id;
        light(pinned ? neighbourhood(pinned) : null);
        announce(pinned ? `${labelOf(n.id)} に留めた。${describe(n.id)}` : '留めるのをやめた。全体に戻した。');
      });
    });
  }
}

// 読み筋はどの型にもあるので、閉じる操作も型で分けない。
// ホバーを持つ型の中に置くと、sequence だけ図の外を押しても閉じなくなる。
stage.addEventListener('click', (e) => {
  // 操作 UI は stage の中にあるので、読み筋のボタンを押すとここまで上がってきて
  // 章が点けた強調を即座に消してしまう（実測: ホバーを持つ 4 型で読み筋が効かなかった）
  if (e.target.closest?.('#panel, #views')) return;
  if (activeView) { setView(null); return; }
  if (SEM.focus === 'none') return;
  const owner = e.target.closest?.('[data-owner]')?.dataset.owner;
  const node = SEM.nodes.find((n) => n.id === owner);
  if (!node) { pinned = null; light(null); return; }
  pinned = pinned === node.id ? null : node.id;
  light(pinned ? neighbourhood(pinned) : null);
});

/* ---- 読み筋 ---- */
const viewsBar = document.getElementById('views');
const note = document.getElementById('note');

// focus に何を並べたかで粒度が決まる。**関係を 1 本でも名指ししたら、名指しした関係だけ**を点ける。
// 両方の端が入っている関係を足す規則と混ぜると、同じ 2 者のあいだの別の関係まで点いてしまい、
// 「一度目」「二度目」のような順序の切り出しが書けなくなる（実測: 参加者 4 人を並べた
// sequence の読み筋が、8 本のやりとり全部を点けて絞り込みにならなかった）。
function idsFor(view) {
  const named = new Set(view.focus);
  const byEdge = SEM.edges.some((e) => named.has(e.id));
  const ids = new Set(named);
  for (const e of SEM.edges) {
    if (!(byEdge ? named.has(e.id) : named.has(e.from) && named.has(e.to))) continue;
    ids.add(e.id); ids.add(`${e.id}-arrow`); ids.add(e.from); ids.add(e.to);
  }
  for (const g of SEM.groups) if (g.wraps.some((id) => ids.has(id))) ids.add(g.id);
  return ids;
}

function setView(id) {
  activeView = id;
  const v = (SEM.views || []).find((x) => x.id === id);
  for (const b of viewsBar.children) b.setAttribute('aria-pressed', String(b.dataset.view === id));
  pinned = null;
  const ids = v ? idsFor(v) : null;
  light(ids);
  note.textContent = v ? v.note || '' : '';
  if (!v) { announce('読み筋を閉じた。全体を表示している。'); return; }
  const nn = SEM.nodes.filter((n) => ids.has(n.id)).length;
  const ee = SEM.edges.filter((e) => ids.has(e.id)).length;
  announce(`読み筋「${v.label}」。${v.note || ''} ノード ${nn} 件、関係 ${ee} 件が残っている。`);
}

for (const v of SEM.views || []) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = v.label; b.dataset.view = v.id; b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => setView(activeView === v.id ? null : v.id));
  viewsBar.appendChild(b);
}

/* ---- 描かれていく。生成済みパスの dash を動かすだけ ---- */
let revealTimer = 0;
function replay() {
  if (reduce) return;
  svg.classList.remove('revealing');
  const strokes = [...svg.querySelectorAll('path.is-stroke:not(.is-dashed)')];
  strokes.forEach((p, i) => {
    const len = p.getTotalLength();
    p.style.setProperty('--len', len);
    p.style.setProperty('--dur', `${Math.min(700, 180 + len * 0.6)}ms`);
    p.style.setProperty('--delay', `${i * 9}ms`);
  });
  const fadeAt = strokes.length * 9 + 260;
  for (const el of svg.querySelectorAll('path.is-fill, path.is-hatch, path.is-dashed, text, .icon')) el.style.setProperty('--fade', `${fadeAt}ms`);
  // クラスを付け直して再生する。void で reflow を挟まないと 2 回目が走らない
  void svg.getBoundingClientRect();
  svg.classList.add('revealing');
  // 終わったらクラスを外す。付けたままだと animation-fill-mode:both が遅延中の
  // from（opacity 0）を保持し続け、アニメーションが進まない経路で図が消える
  clearTimeout(revealTimer);
  revealTimer = setTimeout(() => svg.classList.remove('revealing'), fadeAt + 600);
}

/* ---- 凡例。色が意味を運ぶ以上、対応を出せないと読めない ---- */

/* ---- 書き出し。見えているものをそのまま出す ----
   色は CSS 変数で持っているので、単体ファイルにするには解決済みの値を焼き込む。
   焼き込まないと、開いた先に変数が無くて真っ黒な図になる。 */
const EXPORT_VARS = ['paper', 'ink', 'ink-soft', 'ink-faint', 'line', 'node-fill', 'group-fill',
  'pad-fill', 'frontend', 'backend', 'database', 'cloud', 'security', 'queue', 'external',
  'f-step', 'f-decision', 'f-reference', 'f-script', 'f-agent', 'f-gate', 'f-terminal', 'on-terminal'];

// 題は HTML の見出しにしかないので、単体ファイルにすると何の図か分からなくなる。
// 図の上に帯を足して書き込む。図形は動かさず、根の g をその高さぶん下げるだけ。
const TITLE_BAND = 48;

function standaloneSvg() {
  const clone = svg.cloneNode(true);
  const [w, h] = SEM.viewBox;
  const H = h + TITLE_BAND;
  clone.setAttribute('viewBox', `0 0 ${w} ${H}`);
  clone.setAttribute('width', w);
  clone.setAttribute('height', H);
  clone.classList.remove('has-focus', 'revealing');
  clone.querySelector('g').setAttribute('transform', `translate(0 ${TITLE_BAND})`);
  for (const el of clone.querySelectorAll('[style]')) el.removeAttribute('style');
  for (const el of clone.querySelectorAll('.lit')) el.classList.remove('lit');

  // カスタムプロパティは getComputedStyle が宣言のまま返すので、light-dark() が解決されない。
  // color として一度読ませると解決済みの値になる（実測: そうしないと単体 SVG が常にライトになる）。
  const probe = document.createElement('span');
  probe.style.display = 'none';
  document.body.appendChild(probe);
  const resolve = (name) => { probe.style.color = `var(--${name})`; return getComputedStyle(probe).color; };
  const vars = EXPORT_VARS.map((v) => `--${v}:${resolve(v)}`).join(';');
  const paper = resolve('paper');
  const resolveInk = resolve('ink');
  const resolveInkSoft = resolve('ink-soft');
  const computed = getComputedStyle(document.body);
  probe.remove();
  // **操作 UI だけを外し、それ以外は全部持っていく。**
  // 図の側を名前で拾う形にすると、拾い漏れた規則が黙って落ちて誤った色で描かれる
  // （実測: .lane が落ちて workflow のレーンが SVG 既定の黒塗りになり、
  // .lifeline と .msg-label も消えていた）。落ちて困るのは図の側なので、除外側を列挙する。
  const CHROME = /#(panel|views|note|stage)\b|^\s*(body|header|html)\b|^\s*\.(sub|meta)\b/;
  const sheet = [...document.styleSheets[0].cssRules]
    .filter((r) => r.selectorText && !CHROME.test(r.selectorText))
    .map((r) => r.cssText).join('\n');

  const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.textContent = `svg{${vars};background:var(--paper);font-family:${computed.fontFamily || 'sans-serif'}}\n${sheet}`;
  clone.insertBefore(style, clone.firstChild);
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', w); bg.setAttribute('height', H);
  bg.setAttribute('fill', paper);
  clone.insertBefore(bg, style.nextSibling);

  const head = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  head.setAttribute('x', 24); head.setAttribute('y', 31);
  head.setAttribute('font-size', 17); head.setAttribute('font-weight', 700);
  head.setAttribute('fill', resolveInk);
  head.textContent = SEM.title;
  if (SEM.subtitle) {
    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    sub.setAttribute('dx', 12); sub.setAttribute('font-size', 12.5);
    sub.setAttribute('font-weight', 400); sub.setAttribute('fill', resolveInkSoft);
    sub.textContent = SEM.subtitle;
    head.appendChild(sub);
  }
  clone.insertBefore(head, bg.nextSibling);
  return new XMLSerializer().serializeToString(clone);
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const baseName = (document.title || 'atlas').replace(/[\\/:*?"<>|\s]+/g, '-');
document.getElementById('btn-svg').addEventListener('click', () => {
  download(new Blob([standaloneSvg()], { type: 'image/svg+xml' }), `${baseName}.svg`);
});
document.getElementById('btn-png').addEventListener('click', () => {
  const [w, h] = SEM.viewBox;
  // 題の帯のぶん、書き出す SVG は図より高い。canvas を図の高さのままにすると下端が切れる
  const H = h + TITLE_BAND;
  const scale = 2;
  const img = new Image();
  img.onload = () => {
    const canvas = Object.assign(document.createElement('canvas'), { width: w * scale, height: H * scale });
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob((blob) => download(blob, `${baseName}.png`), 'image/png');
  };
  img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(standaloneSvg())}`;
});

const themeBtn = document.getElementById('btn-theme');
const paint = () => { themeBtn.textContent = document.documentElement.style.colorScheme === 'dark' ? 'ライト' : 'ダーク'; };
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.style.colorScheme === 'dark';
  document.documentElement.style.colorScheme = dark ? 'light' : 'dark';
  paint();
});
document.getElementById('btn-fit').addEventListener('click', fit);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-in').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); });
document.getElementById('btn-out').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); });

document.getElementById('meta').textContent =
  `${SEM.source ? `${SEM.source}  ·  ` : ''}ノード ${SEM.nodes.length} / 関係 ${SEM.edges.length}`;
if (SEM.focus === 'flow') svg.classList.add('flow');
paint();
fit();
// 紙は画面と縦横比が違う。印刷の直前に収め直さないと、いま拡大している範囲だけが刷られる
addEventListener('beforeprint', () => { svg.classList.remove('revealing'); fit(); });
// flex のレイアウトが確定する前に測ると stage の高さが 0 になる。
// requestAnimationFrame はフレームを作れない環境で発火しないので、寸法そのものを見る。
new ResizeObserver(() => fit()).observe(stage);
addEventListener('load', () => { fit(); replay(); });
</script>
</body>
</html>
