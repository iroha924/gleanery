<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- 折り返す糸。線は 2 単位（16px 表示で 2 デバイス px）で 16 の格子に乗せてある。
       拡大縮小しても滲まないので、太さも座標もそのままにする。 -->
  <style>
    :root { --ink: #2c2c2b; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f0; } }
  </style>
  <g transform="translate(-0.3 0.75)">
    <path d="M4 2 V10 a2.5 2.5 0 0 0 5 0 V5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="square"/>
    <circle cx="12" cy="5" r="1.6" fill="var(--ink)"/>
  </g>
</svg>
