pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,json,css}"
      run: bunx --bun @biomejs/biome@2.5.12 check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bunx tsc --noEmit
    - name: typecheck-dashboard
      root: dashboard/
      glob: "*.{ts,tsx}"
      run: bunx tsc -b
    # dist は配布物。ソースだけ直して bundle を忘れると、
    # Codex 側（依存を自動インストールしない）で古いコードが動き続ける。
    - name: bundle
      glob: "server/src/*.ts"
      run: |
        bun build server/src/mcp.ts --target=node --outfile dist/mcp.js
        bun build server/src/hook-check-path.ts --target=node --outfile dist/hook-check-path.js
        git add dist/
