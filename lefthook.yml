pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,json,css}"
      run: bunx --bun @biomejs/biome@2.5.12 check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bunx tsc --noEmit
    - name: typecheck-dashboard
      root: dashboard/
      glob: "*.{ts,tsx}"
      run: bunx tsc -b
    # dist は配布物。ソースだけ直して bundle を忘れると、
    # Codex 側（依存を自動インストールしない）で古いコードが動き続ける。
    # **版の判定は bundle の後でなければ意味が無い。**parallel なので別ジョブにすると
    # 作り直す前のバンドルを読んで素通りする（実測: 4/4 で通った）。同じジョブで順に走らせる。
    # 理由は AGENTS.md「MCP を直したら、版を上げないと誰にも届かない」。
    - name: bundle
      glob: "{server/src/*.ts,plugin/**}"
      # **`set -e` を置く。**複数行の run は最後のコマンドの終了コードだけが結果になるので、
      # これが無いと bundle が失敗しても後ろの検査が 0 を返して打ち消す。
      run: |
        set -e
        bun run bundle
        git add plugin/dist/
        bun run scripts/check-mcp-version.mjs
    # 同じ知識が複数の出口に写されている場所を突き合わせる。
    # 理由は AGENTS.md「片方を直したら対を探す」。README の CLI 一覧は
    # 突き合わせではなく USAGE から書き出すので、書き直した分を staged へ戻す。
    - name: pairs
      glob: "{server/src/*.ts,dashboard/src/routes/search.tsx,README.md}"
      run: |
        set -e
        node scripts/check-pairs.mjs
        git add README.md
