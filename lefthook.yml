pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: bunx --bun @biomejs/biome@2.5.12 check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bun run typecheck
    - name: typecheck-dashboard
      root: dashboard/
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    - name: dashboard-architecture
      glob: "{dashboard/src/**/*.ts,dashboard/src/**/*.tsx,server/src/server.ts,scripts/check-dashboard-boundaries.mjs,package.json}"
      run: bun run architecture
    - name: ai-config
      glob: "{AGENTS.md,CLAUDE.md,dashboard/AGENTS.md,dashboard/CLAUDE.md,.agents/skills/**,.claude/skills/**,plugin/agents/**,plugin/skills/**,scripts/check-ai-config.mjs,package.json}"
      run: bun run verify:ai
    # 配布物（plugin/dist、plugin/db）は追跡せず、npm へ publish するときに bundle から作る。
    # **だからここで確かめるのは「束ねられること」と「版が上がっていること」だけである。**
    # 版の判定は bundle の後でなければ意味が無く、parallel なので別ジョブにすると
    # 作り直す前のバンドルを読んで素通りする（実測: 4/4 で通った）。同じジョブで順に走らせる。
    # 配布経路と壊れ方は .agents/skills/plugin-release/SKILL.md が正本。
    - name: bundle
      # **束ねる入力を全部挙げる。**dist は追跡しないので、ここから漏れた入力を変えると
      # 中身が変わったのに版の検査が走らない。マーケットプレースのマニフェストも版を持つ。
      glob: "{server/src/**/*.ts,dashboard/src/**,dashboard/index.html,db/**,scripts/bundle.mjs,plugin/**,.claude-plugin/**}"
      # **`set -e` を置く。**複数行の run は最後のコマンドの終了コードだけが結果になるので、
      # これが無いと bundle が失敗しても後ろの検査が 0 を返して打ち消す。
      run: |
        set -e
        bun run bundle
        bun run scripts/check-mcp-version.mjs
    # 同じ知識が複数の出口に写されている場所を突き合わせる。
    # 理由と過去の事例は docs/ai-development.md。README の CLI 一覧は
    # 突き合わせではなく `gleanery --help` から書き出すので、書き直した分を staged へ戻す。
    - name: pairs
      glob: "{db/schema.sql,server/src/*.ts,dashboard/src/features/_sessions/api/sessions.ts,README.md,plugin/skills/review/SKILL.md,plugin/agents/*.md,scripts/check-pairs.mjs}"
      # **`git add` はここに書かない。**無条件に走ると、README に残っていた別件の編集まで
      # コミットへ巻き込む。書き換えたときだけ check-pairs.mjs 自身が staged へ戻す。
      run: node scripts/check-pairs.mjs

# pre-commit は速い静的検査に限る。push 前にサーバーのテストと Next.js の本番ビルドまで通し、
# Hono 側のロジックと App Router のバンドル・prerender の両方をローカルで確かめる。
pre-push:
  jobs:
    - name: verify
      # git は hook へ GIT_DIR などを export し、worktree ではそれが絶対パスになる。残すとテストが作る一時リポジトリの
      # git がこのリポジトリを向き、テストが落ちるうえに設定と branch へ書き込む（実測: core.bare=true と user.* を書き、
      # commit を 2 つ積んだ）。githooks(5) の勧めどおり消してから走らせる。
      run: unset $(git rev-parse --local-env-vars); bun run verify
