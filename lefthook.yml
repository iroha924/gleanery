pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: bunx --bun @biomejs/biome@2.5.14 check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bun run typecheck
    - name: ai-config
      glob: "{AGENTS.md,CLAUDE.md,.agents/skills/**,.claude/skills/**,.claude-plugin/**,plugin/skills/review/reviewers/**,plugin/skills/**,scripts/check-ai-config.mjs,package.json}"
      run: bun run verify:ai
    # 版の判定は bundle の後でなければ意味が無い。別ジョブにすると parallel なので、
    # 作り直す前のバンドルを読んで素通りする（実測: 4/4 で通った）。
    - name: bundle
      glob: "{server/src/**/*.ts,db/**,scripts/bundle.mjs,scripts/bundle-cli.ts,plugin/**,.claude-plugin/**}"
      # set -e が無いと、bundle が落ちても後ろの検査の 0 が打ち消す。
      run: |
        set -e
        bun run bundle
        bun run scripts/check-mcp-version.mjs
    # 見るのは SQL の書き方だけ。組み立てた SQL を実 PostgreSQL へ通す `sql:parse` は Docker が
    # 要るのでここでは走らせない。構文エラー・消えた列・一意 index の無い on conflict は CI だけが見る。
    - name: sql
      glob: "{server/src/**/*.ts,server/test/**/*.ts,scripts/check-sql.mjs}"
      run: bun run sql
    - name: pairs
      glob: "{db/schema.sql,server/src/*.ts,README.md,plugin/skills/review/SKILL.md,plugin/skills/review/reviewers/*.md,scripts/check-pairs.mjs}"
      # git add をここに書かない。無条件に走ると README の別件の編集まで巻き込む。
      # 書き換えたときだけ check-pairs.mjs 自身が staged へ戻す。
      run: node scripts/check-pairs.mjs

pre-push:
  jobs:
    - name: verify
      # 残すと、テストが作る一時リポジトリの git がこのリポジトリを向く
      # （実測: core.bare=true と user.* を書き、commit を 2 つ積んだ）。
      run: unset $(git rev-parse --local-env-vars); bun run verify
