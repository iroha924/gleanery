commit-msg:
  jobs:
    - name: commit-message
      run: node scripts/check-commit-msg.mjs {1}

pre-commit:
  parallel: true
  jobs:
    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: mise exec -- actionlint {staged_files}
    - name: biome
      glob: "*.{ts,mts,tsx,js,mjs,cjs,json,jsonc}"
      run: server/node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bun run typecheck
    - name: ai-config
      glob: "{AGENTS.md,CLAUDE.md,.agents/skills/**,.claude/skills/**,.claude/rules/**,.claude/agents/**,.claude-plugin/**,plugin/skills/review/reviewers/**,plugin/skills/**,scripts/check-ai-config.mjs,package.json}"
      run: bun run verify:ai
    # バージョンの判定は bundle の後でなければ意味が無い。別ジョブにすると parallel なので、
    # 作り直す前のバンドルを読んで素通りする（実測: 4/4 で通った）。
    - name: bundle
      # release-scope.mjs の配布物の入力と揃える（入力を変えてバージョンを据え置く commit をここで止める）
      glob: "{server/src/**,db/**,scripts/bundle.mjs,scripts/bundle-cli.ts,scripts/third-party-notices.mjs,scripts/licenses/**,server/package.json,server/bun.lock,server/tsconfig.json,plugin/**,.claude-plugin/**,README.md}"
      # set -e が無いと、bundle が落ちても後ろの検査の 0 が打ち消す。
      run: |
        set -e
        bun run bundle
        bun run scripts/check-mcp-version.mjs
    # 見るのは SQL の書き方だけ。SQL が本物の SQLite で実行されたか（sql:reach）と子プロセスのレーン（sql:live）は
    # test を流し直すので、pre-push の verify と CI が見る。
    - name: sql
      glob: "{server/src/**/*.ts,server/test/**/*.ts,scripts/check-sql.mjs}"
      run: bun run sql
    - name: architecture
      glob: "{server/src/**/*.ts,scripts/check-architecture.mjs}"
      run: bun run architecture
    - name: english
      glob: "{server/src/*.ts,server/src/**/*.ts,scripts/check-english.mjs,scripts/lib/english.mjs}"
      run: bun run english
    - name: codegen
      glob: "{db/schema.sql,server/src/db-types.ts,server/src/kysely-node-sqlite.ts,server/package.json,server/bun.lock,scripts/codegen.mjs}"
      run: bun run codegen:check
    - name: rule-scopes
      glob: "{.claude/rules/**,scripts/check-rule-scopes.mjs,server/**/*.ts,db/schema.sql,lefthook.yml,README.md,AGENTS.md,package.json}"
      run: bun run rule-scopes
    - name: pairs
      glob: "{db/schema.sql,server/src/*.ts,plugin/skills/review/SKILL.md,plugin/skills/review/reviewers/*.md,scripts/check-pairs.mjs}"
      run: node scripts/check-pairs.mjs

pre-push:
  jobs:
    - name: verify
      # 残すと、テストが作る一時リポジトリの git がこのリポジトリを向く
      # （実測: core.bare=true と user.* を書き、commit を 2 つ積んだ）。
      run: unset $(git rev-parse --local-env-vars); bun run verify
