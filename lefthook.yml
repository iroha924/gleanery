pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,json,css}"
      run: bunx --bun @biomejs/biome@2.5.12 check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bunx tsc --noEmit
    - name: typecheck-dashboard
      root: dashboard/
      glob: "*.{ts,tsx}"
      run: bunx tsc -b
    # dist は配布物。ソースだけ直して bundle を忘れると、
    # Codex 側（依存を自動インストールしない）で古いコードが動き続ける。
    - name: bundle
      glob: "server/src/*.ts"
      run: |
        bun run bundle
        git add plugin/dist/
    # **MCP は版を上げないとキャッシュへ複製されない。**Claude Code はプラグインを
    # ~/.claude/plugins/cache/<名前>/<版>/ から動かし、複製は版が変わったときだけ起きる。
    # 「版を上げる」を AGENTS.md に書いたが、書いた本人が 3 時間で 8 回踏んだ（実測）。
    # 守られる保証が要るものは規約ではなく機構に置く。
    - name: mcp-version
      glob: "server/src/mcp.ts"
      run: |
        bun run scripts/check-mcp-version.mjs
