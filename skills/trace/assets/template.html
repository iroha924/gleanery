<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script type="application/json" id="progress-ir">__IR__</script>
<style>
:root{
  --bg:#fbf9f4; --panel:#fff; --ink:#25211c; --dim:#6b6459; --line:#e2dbcd;
  --accent:#b5651d; --ok:#4f7a3f; --warn:#b58900; --bad:#a03030; --idle:#9a938a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1b18; --panel:#262320; --ink:#ece4d8; --dim:#a49a8c; --line:#3a352e;
  --accent:#e08a3c; --ok:#8fbf6f; --warn:#d9b64a; --bad:#e07a6a; --idle:#7d766c;
}}
:root[data-theme="dark"]{
  --bg:#1d1b18; --panel:#262320; --ink:#ece4d8; --dim:#a49a8c; --line:#3a352e;
  --accent:#e08a3c; --ok:#8fbf6f; --warn:#d9b64a; --bad:#e07a6a; --idle:#7d766c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;
  font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:32px 24px 96px}
a{color:var(--accent)}
h1{font-size:26px;line-height:1.4;margin:0 0 4px}
h2{font-size:19px;margin:44px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
h3{font-size:15px;margin:22px 0 6px}
p{margin:0 0 10px}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px}
pre{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;overflow-x:auto;margin:8px 0;line-height:1.6}
.muted{color:var(--dim)}
.small{font-size:12.5px}

/* 冒頭 1 画面。最重要のものを先頭に置く */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:18px 0 8px}
.hero .goal{font-size:16px;margin:10px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.now{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 0}
@media(max-width:720px){.now{grid-template-columns:1fr}}
.now section{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.now h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}

.badge{display:inline-block;font-size:11.5px;line-height:1.6;padding:1px 9px;border-radius:999px;
  border:1px solid currentColor;white-space:nowrap;font-family:var(--mono)}
.b-done{color:var(--ok)} .b-doing{color:var(--accent)} .b-blocked{color:var(--bad)}
.b-todo{color:var(--idle)} .b-warn{color:var(--warn)}

/* 工程バー */
.phases{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.phase{flex:1 1 90px;min-width:90px;border-radius:6px;padding:7px 10px;border:1px solid var(--line);
  background:var(--bg);font-size:12.5px}
.phase b{display:block;font-weight:600}
.phase.done{border-color:var(--ok);box-shadow:inset 3px 0 var(--ok)}
.phase.doing{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.phase.blocked{border-color:var(--bad);box-shadow:inset 3px 0 var(--bad)}

/* タイムライン */
.tl{position:relative;margin:10px 0 0;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ev{position:relative;padding:9px 0}
.ev::before{content:"";position:absolute;left:-18px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--idle)}
.ev.k-finding::before{border-color:var(--warn)}
.ev.k-dead_end::before{border-color:var(--bad)}
.ev.k-debt::before{border-color:var(--warn);background:var(--warn)}
.ev.k-state_transition::before{border-color:var(--accent)}
.ev .head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ev time{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* カード */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.card.sup{opacity:.62}
.card h3{margin:0 0 2px}
.opts{list-style:none;padding:0;margin:8px 0 0}
.opts li{padding:5px 0 5px 20px;position:relative;border-top:1px dashed var(--line)}
.opts li::before{content:"×";position:absolute;left:2px;color:var(--bad);font-family:var(--mono)}
.opts li.chosen::before{content:"✓";color:var(--ok)}
.cons{margin:8px 0 0;padding-left:20px}
.cons li.bad{color:var(--bad)}

table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600;color:var(--dim);font-size:12px}
/* 短い値の列が折り返して 3 行になるのを防ぐ。折り返すのは本文の列だけでよい */
td:not(:first-child),th:not(:first-child){white-space:nowrap}
td:first-child{width:100%}

.ev-refs{margin:4px 0 0;font-size:12px;font-family:var(--mono);color:var(--dim);
  display:flex;gap:10px;flex-wrap:wrap}
.conf{font-size:11px;font-family:var(--mono)}
.conf-inference,.conf-opinion{color:var(--warn)}

button[data-filter]{font:inherit;font-size:12.5px;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;margin-right:4px}
button[data-filter][aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
details{margin:10px 0}
summary{cursor:pointer;color:var(--dim);font-size:13px;padding:4px 0}
.empty{color:var(--dim);font-style:italic}
.gen{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
svg{max-width:100%;height:auto}
@media print{body{background:#fff}details{display:block}details>summary{display:none}}
</style>
</head>
<body>
<div class="wrap">
__BODY__
</div>
<script>
// 折りたたみは details に任せてあるので、ここは表示切り替えだけ。JS が無くても読める。
document.querySelectorAll('[data-filter]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var k = btn.getAttribute('data-filter');
    document.querySelectorAll('.ev').forEach(function(el){
      el.hidden = k !== 'all' && !el.classList.contains('k-' + k);
    });
    document.querySelectorAll('[data-filter]').forEach(function(b){ b.setAttribute('aria-pressed', b === btn); });
  });
});
</script>
</body>
</html>
